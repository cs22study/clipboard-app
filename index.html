<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端記事截圖 App</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        #preview { 
            max-width: 100%; 
            border: 2px dashed #ccc; 
            min-height: 200px; 
            margin-top: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #888; 
        }
        textarea { width: 100%; height: 80px; margin-top: 10px; padding: 5px; }
        button { margin-top: 10px; padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>快速截圖與記事</h2>
    <p>請使用截圖快捷鍵 (如 Win+Shift+S) 截圖後，直接在此網頁按 <strong>Ctrl+V</strong> 貼上。</p>
    
    <!-- 圖片預覽區塊 -->
    <div id="preview">圖片預覽區 (尚未貼上圖片)</div>
    
    <!-- 文字輸入區塊 -->
    <textarea id="note" placeholder="在這裡輸入簡要記事..."></textarea>
    <br>
    <button id="uploadBtn">上傳至 Google 雲端</button>

    <script>
        const previewDiv = document.getElementById('preview');
        let currentBase64Image = null; // 用來儲存準備上傳的圖片資料

        // 監聽網頁上的「貼上 (paste)」事件
        window.addEventListener('paste', function(e) {
            const items = e.clipboardData.items; // 取得剪貼簿內容
            
            for (let i = 0; i < items.length; i++) {
                // 如果貼上的內容是圖片
                if (items[i].type.indexOf('image') !== -1) {
                    const blob = items[i].getAsFile();
                    const reader = new FileReader();
                    
                    // 讀取完成後，將圖片顯示在網頁上，並記錄 Base64 字串
                    reader.onload = function(event) {
                        currentBase64Image = event.target.result;
                        previewDiv.innerHTML = `<img src="${currentBase64Image}" style="max-width: 100%;">`;
                    };
                    
                    reader.readAsDataURL(blob); // 啟動讀取並轉換為 Base64
                }
            }
        });

        const uploadBtn = document.getElementById('uploadBtn');

        // 監聽上傳按鈕點擊事件
        uploadBtn.addEventListener('click', function() {
            if (!currentBase64Image) {
                alert('請先按 Ctrl+V 貼上截圖！');
                return;
            }

            const noteText = document.getElementById('note').value;
            const gasUrl = 'https://script.google.com/macros/s/AKfycbxA8bKDmqH5VZYDqbgmUNvkZHu5yeRLeDWWCI7KQBfLxBvlJDWChkOgKpPHwNhmKR9B/exec'; // ★ 替換為您的網址

            // 更改按鈕狀態，避免重複點擊
            uploadBtn.innerText = '上傳中，請稍候...';
            uploadBtn.disabled = true;

            // 使用 fetch API 傳送資料到 GAS
            fetch(gasUrl, {
                method: 'POST',
                // 使用 text/plain 可避免 GAS 嚴格的 CORS 預檢限制
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify({
                    image: currentBase64Image,
                    note: noteText
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('上傳成功！');
                    // 成功後清空畫面，方便下一次截圖
                    currentBase64Image = null;
                    previewDiv.innerHTML = '圖片預覽區 (尚未貼上圖片)';
                    document.getElementById('note').value = '';
                } else {
                    alert('後端處理失敗：' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('網路傳輸發生錯誤，請按 F12 檢查控制台。');
            })
            .finally(() => {
                // 恢復按鈕狀態
                uploadBtn.innerText = '上傳至 Google 雲端';
                uploadBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
